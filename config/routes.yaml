controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

app_welcome:
    path: /welcome
    controller: App\Controller\HomeController::welcome

app_home:
    path: /
    controller: App\Controller\HomeController::index

app_note:
   path: /note/{note?1}
   controller: App\Controller\HomeController::note
   requirements:
       note: '\d+'